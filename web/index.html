<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Täydelliset auringonpimennykset 1986–2066</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<div id="version"></div>

<div id="title">
  <div id="picker-wrap">
  <button id="eclipse-card" type="button"
          aria-haspopup="listbox" aria-expanded="false" aria-controls="eclipse-menu">
    <span class="eyebrow">Täydelliset auringonpimennykset</span>
    <span id="card-title">&nbsp;</span>
    <span id="card-badge"></span>
    <span id="title-info"></span>
    <!-- The signpost: a row that looks like a button and names the action. -->
    <span id="pick-btn">
      <span id="pick-label">Valitse pimennys</span>
      <svg id="chev" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 9 12 16 19 9" fill="none" stroke="currentColor"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
    <div id="eclipse-menu" role="listbox" aria-label="Valitse pimennys" hidden></div>
  </div>
  <p class="hint">Klikkaa karttaa: kello siirtyy siihen hetkeen ja paikan
    omaan aikavyöhykkeeseen</p>
</div>

<div id="bar">
  <div id="controls">
    <button id="play" aria-label="Toista / pysäytä">
      <svg viewBox="0 0 24 24" class="ico-play"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" class="ico-pause"><path d="M7 5h3.2v14H7zm6.8 0H17v14h-3.2z"/></svg>
    </button>
    <button id="speed" aria-label="Nopeus">300&times;</button>
    <button id="jump" aria-label="Hyppää suurimpaan pimennykseen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.3V12l3.2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <input id="slider" type="range" min="0" max="1000" value="0" step="1" aria-label="Aika">
  </div>
  <!-- The big reading is the wall clock of the place last clicked; UTC stays
       alongside it so the two are never confused. -->
  <div id="clock">
    <div id="clock-time">--:--:--</div>
    <div id="clock-date"><span id="clock-zone">UTC</span> ·
      <span id="clock-day"></span><span id="clock-utc-wrap"> ·
      <span id="clock-utc">--:--:--</span> UTC</span></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Data as plain script assignments so the page also works from a file:// URL.
     The catalogue is small and always loaded; each eclipse's geometry is pulled
     in on demand from ../data/eclipses/ when it is picked. -->
<script src="eclipse-index.js"></script>
<script src="eclipse-default.js"></script>
<script src="tz.js"></script>
<script src="app.js"></script>
</body>
</html>
